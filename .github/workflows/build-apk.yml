name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Não presumir que sdkmanager esteja no PATH do runner (build #8, exit 127).
      # Esta ação instala as ferramentas de linha de comando, configura o SDK/PATH
      # e aceita as licenças antes de chamar sdkmanager.
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Instalar Android SDK 36 e Build Tools
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          # O cache inclui dependências e o cache local de tarefas do Gradle.

      - name: Verificar versionamento e compatibilidade do build
        run: |
          python3 scripts/check_version.py
          python3 scripts/check_build_config.py

      - name: Compilar APK release
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          gradle assembleRelease --no-daemon --build-cache --console=plain --stacktrace
          echo "Tempo do Gradle: ${SECONDS}s"

      # Nome final: <app_name sem acento e sem espaço>-<versionName>.apk  (ex.: MinhaCamera-1.4.6.apk)
      - name: Nomear APK
        id: apk
        run: |
          NAME=$(grep 'name="app_name"' app/src/main/res/values/strings.xml | sed 's/.*">\(.*\)<\/string>.*/\1/')
          SLUG=$(python3 -c "import sys,re,unicodedata; n=unicodedata.normalize('NFKD',sys.argv[1]).encode('ascii','ignore').decode(); print(re.sub(r'[^A-Za-z0-9]+','',n))" "$NAME")
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          FILE="${SLUG}-${VERSION}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${FILE}"
          echo "path=dist/${FILE}" >> "$GITHUB_OUTPUT"

      # Único artifact: o APK solto (sem ZIP). O nome do artifact = nome do arquivo.
      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
