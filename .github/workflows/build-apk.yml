name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Não presumir que sdkmanager esteja no PATH do runner (build #8, exit 127).
      # Esta ação instala as ferramentas de linha de comando, configura o SDK/PATH
      # e aceita as licenças antes de chamar sdkmanager.
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Instalar Android SDK 36 e Build Tools
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          # O cache inclui dependências e o cache local de tarefas do Gradle.

      - name: Verificar versionamento e compatibilidade do build
        run: |
          python3 scripts/check_version.py
          python3 scripts/check_build_config.py
          python3 tests/test_qr_integration.py

      - name: Preparar assinatura Release permanente
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret obrigatório ausente: ${name}. Importe os quatro Secrets no repositório."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/minha-camera-release.p12"
          keytool -list -storetype PKCS12 \
            -keystore "${RUNNER_TEMP}/minha-camera-release.p12" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          keytool -exportcert -storetype PKCS12 \
            -keystore "${RUNNER_TEMP}/minha-camera-release.p12" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            -file "${RUNNER_TEMP}/minha-camera-cert.der" > /dev/null
          python3 - <<'PY_CERT'
          from pathlib import Path
          import hashlib, os
          expected = Path('docs/SIGNING_CERT_SHA256.txt').read_text().strip().lower()
          actual = hashlib.sha256((Path(os.environ['RUNNER_TEMP']) / 'minha-camera-cert.der').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('Certificado diferente do fixado no projeto. Não publicar APKs com assinatura inesperada.')
          print('Certificado de assinatura permanente confirmado.')
          PY_CERT

      # Compilação de código/recursos compartilhada: não usar matrix por ABI.
      - name: Testar protocolos e compilar todos os APKs release
        shell: bash
        env:
          MINHACAMERA_KEYSTORE_PATH: ${{ runner.temp }}/minha-camera-release.p12
          MINHACAMERA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MINHACAMERA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MINHACAMERA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SECONDS=0
          gradle testProtocol testReleaseUnitTest assembleRelease --no-daemon --build-cache --console=plain --stacktrace
          echo "Tempo do Gradle (testes e todos os APKs): ${SECONDS}s"

      - name: Verificar e nomear APKs; medir tamanhos
        id: apk
        run: python3 scripts/verify_apks.py

      - name: Publicar APK universal
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.universal }}
          archive: false
          if-no-files-found: error

      - name: Publicar APK armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.armeabi-v7a }}
          archive: false
          if-no-files-found: error

      - name: Publicar APK arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.arm64-v8a }}
          archive: false
          if-no-files-found: error

      - name: Publicar APK x86_64
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.x86_64 }}
          archive: false
          if-no-files-found: error

      - name: Publicar APK x86
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.x86 }}
          archive: false
          if-no-files-found: error

      - name: Publicar relatório e hashes
        uses: actions/upload-artifact@v7
        with:
          name: MinhaCamera-APK-verificacao
          path: |
            dist/apk-report.md
            dist/apk-report.json
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Limpar chave privada do runner
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/minha-camera-release.p12" "${RUNNER_TEMP}/minha-camera-cert.der"
