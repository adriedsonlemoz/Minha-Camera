name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já traz o Android SDK; só aceitamos as licenças.
      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK release
        run: gradle assembleRelease --no-daemon --stacktrace

      # Nome final: <app_name sem acento e sem espaço>-<versionName>.apk  (ex.: MinhaCamera-1.3.1.apk)
      - name: Nomear APK
        id: apk
        run: |
          NAME=$(grep 'name="app_name"' app/src/main/res/values/strings.xml | sed 's/.*">\(.*\)<\/string>.*/\1/')
          SLUG=$(python3 -c "import sys,re,unicodedata; n=unicodedata.normalize('NFKD',sys.argv[1]).encode('ascii','ignore').decode(); print(re.sub(r'[^A-Za-z0-9]+','',n))" "$NAME")
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          FILE="${SLUG}-${VERSION}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${FILE}"
          echo "path=dist/${FILE}" >> "$GITHUB_OUTPUT"

      # Único artifact: o APK solto (sem ZIP). O nome do artifact = nome do arquivo.
      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
